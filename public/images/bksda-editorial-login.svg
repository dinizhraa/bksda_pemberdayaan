<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Petugas BKSDA mengelola kelompok binaan</title>
  <desc id="desc">Ilustrasi editorial dua petugas berdiskusi di ruang kerja konservasi dengan laptop, dokumen, peta, grafik, dan tanaman</desc>
  <style>
    @keyframes float-card {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -5px; }
    }

    @keyframes person-shift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes leaf-move {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes bar-rise {
      from { transform: scaleY(.55); opacity: .65; }
      to { transform: scaleY(1); opacity: 1; }
    }

    .floating-card {
      transform-box: fill-box;
      transform-origin: center;
      animation: float-card 5.8s ease-in-out infinite;
    }

    .floating-card.delay {
      animation-delay: -2.4s;
    }

    .petugas-left {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: person-shift 5.4s ease-in-out infinite;
    }

    .petugas-right {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: person-shift 6s ease-in-out -2.2s infinite;
    }

    .plant-leaves {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: leaf-move 5s ease-in-out infinite;
    }

    .growth-bar {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: bar-rise .9s cubic-bezier(.2, .7, .2, 1) both;
    }

    .growth-bar.delay-1 { animation-delay: .12s; }
    .growth-bar.delay-2 { animation-delay: .24s; }
    .growth-bar.delay-3 { animation-delay: .36s; }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
