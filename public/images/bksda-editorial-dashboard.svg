<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Penyuluh BKSDA dan kelompok binaan mengelola data</title>
  <desc id="desc">Ilustrasi editorial petugas dan warga bekerja bersama di meja dengan laptop, dokumen, peta kawasan, dan grafik</desc>
  <style>
    @keyframes float-gentle {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -4px; }
    }

    @keyframes character-shift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.5px); }
    }

    @keyframes leaf-sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes chart-rise {
      from { transform: scaleY(.58); opacity: .7; }
      to { transform: scaleY(1); opacity: 1; }
    }

    .float-card {
      transform-box: fill-box;
      transform-origin: center;
      animation: float-gentle 5.6s ease-in-out infinite;
    }

    .float-card.delay {
      animation-delay: -2.5s;
    }

    .person-left,
    .person-right {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: character-shift 5.6s ease-in-out infinite;
    }

    .person-right {
      animation-delay: -2.1s;
    }

    .leaves {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: leaf-sway 5.2s ease-in-out infinite;
    }

    .bar {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: chart-rise .85s cubic-bezier(.2, .7, .2, 1) both;
    }

    .bar.delay-1 { animation-delay: .12s; }
    .bar.delay-2 { animation-delay: .24s; }
    .bar.delay-3 { animation-delay: .36s; }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
