<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kolaborasi pengelolaan kawasan konservasi</title>
  <desc id="desc">Tiga petugas BKSDA membahas grafik dan peta kawasan konservasi pada layar digital</desc>
  <style>
    @keyframes staff-breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.5px); }
    }

    @keyframes bar-grow {
      from { transform: scaleY(.55); opacity: .6; }
      to { transform: scaleY(1); opacity: 1; }
    }

    .staff {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: staff-breathe 5.2s ease-in-out infinite;
    }

    .staff.delay { animation-delay: -2.1s; }

    .bar {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: bar-grow .9s cubic-bezier(.2, .7, .2, 1) both;
    }

    .bar.delay-1 { animation-delay: .12s; }
    .bar.delay-2 { animation-delay: .24s; }
    .bar.delay-3 { animation-delay: .36s; }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
