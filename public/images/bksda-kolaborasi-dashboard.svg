<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kolaborasi pemantauan kawasan konservasi</title>
  <desc id="desc">Petugas BKSDA mengelola peta kawasan dan grafik pemantauan bersama tim lapangan</desc>
  <style>
    @keyframes person-shift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }

    @keyframes bars-rise {
      from { transform: scaleY(.58); opacity: .65; }
      to { transform: scaleY(1); opacity: 1; }
    }

    .person {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: person-shift 5.4s ease-in-out infinite;
    }

    .person.delay { animation-delay: -2s; }

    .bar {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: bars-rise .85s cubic-bezier(.2, .7, .2, 1) both;
    }

    .bar.delay-1 { animation-delay: .12s; }
    .bar.delay-2 { animation-delay: .24s; }
    .bar.delay-3 { animation-delay: .36s; }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
